<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@font-face {
  font-family: "eUkraine";
  src: url("https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-Ukraine-Regular.woff2") format("woff2");
  font-weight: 400;
}

@font-face {
  font-family: "eUkraine";
  src: url("https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-Ukraine-Light.woff2") format("woff2");
  font-weight: 300;
}

@font-face {
  font-family: "eUkraine";
  src: url("https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-Ukraine-Bold.woff2") format("woff2");
  font-weight: 700;
}

@font-face {
  font-family: "eUkraineHead";
  src: url("https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-UkraineHead-Bold.woff2") format("woff");
  font-weight: 700;
}

:root {
  --ink: #111;
  --muted: #6B7280;
  --hair: #E4E4E4;
  --dark: #4A4741;
  --blue: #0B3CEA;
  --m-bg: #EEF2FD;
  --rus: #A0141E;
  --p-bg: #FDEFEE;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: auto;
  min-height: 0;
  overflow-x: hidden;
}

body {
  font-family: "eUkraine", Arial, sans-serif;
  color: var(--ink);
  background: #fff;
  padding: 40px 40px 0;
}

.wrap {
  width: 100%;
  max-width: 1360px;
  margin: 0 auto;
}

h1 {
  font-family: "eUkraineHead", "eUkraine", Arial, sans-serif;
  font-size: 38px;
  line-height: 1.08;
  margin: 0 0 12px;
  font-weight: 700;
}

.subtitle {
  font-size: 17px;
  line-height: 1.4;
  color: var(--muted);
  margin-bottom: 28px;
}

/* LEGEND */

.legend {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.legend-item {
  font-size: 13px;
  line-height: 1.3;
  color: var(--muted);
}

.legend-item strong {
  color: var(--ink);
  font-weight: 700;
}

/* GROUPS */

.groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  width: 100%;
}

/* ONE GROUP */

.group {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
  gap: 10px;
  align-items: stretch;
  min-width: 0;
  width: 100%;
}

/* MACHINE CARD */

.m {
  background: var(--m-bg);
  border: 1px solid #D7DFF7;
  min-width: 0;
  overflow: hidden;
}

.m .photo {
  width: 100%;
  height: 162px;
  object-fit: cover;
  display: block;
}

.m .content {
  padding: 13px;
}

.m .type {
  font-size: 11px;
  line-height: 1.2;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 7px;
  font-weight: 700;
}

.m .name {
  font-size: 15px;
  line-height: 1.3;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.m .meta {
  font-size: 11px;
  line-height: 1.35;
  color: var(--muted);
  margin-top: 7px;
}

/* PRODUCER CARD */

.p {
  background: var(--p-bg);
  border: 1px solid #F0D4D1;
  min-width: 0;
  overflow: hidden;
}

.p .logo-wrap {
  min-height: 162px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.p .logo {
  max-width: 100%;
  max-height: 104px;
  width: auto;
  height: auto;
  object-fit: contain;
}

.p .content {
  padding: 13px;
}

.p .country {
  font-size: 11px;
  line-height: 1.2;
  color: var(--rus);
  text-transform: uppercase;
  margin-bottom: 7px;
  font-weight: 700;
}

.p .name {
  font-size: 15px;
  line-height: 1.3;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* ARROW */

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.arrow svg {
  width: 100%;
  max-width: 28px;
  height: auto;
  overflow: visible;
}

/* FOOTER */

.footer {
  border-top: 1px solid var(--hair);
  margin-top: 28px;
  padding: 14px 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.source {
  font-size: 10px;
  line-height: 1.45;
  color: var(--muted);
}

.footer img {
  width: 100px;
  height: auto;
  object-fit: contain;
}

/* MOBILE */

@media (max-width: 900px) {

  body {
    padding: 28px 24px 0;
  }

  h1 {
    font-size: 30px;
  }

  .subtitle {
    font-size: 15px;
  }

  .groups {
    grid-template-columns: 1fr;
  }

  .group {
    grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
  }
}

@media (max-width: 600px) {

  body {
    padding: 20px 14px 0;
  }

  h1 {
    font-size: 25px;
  }

  .subtitle {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .legend {
    display: none;
  }

  .groups {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .group {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .arrow {
    transform: rotate(90deg);
    height: 22px;
  }

  .m .photo {
    height: 104px;
  }

  .p .logo-wrap {
    min-height: 104px;
    padding: 14px;
  }

  .p .logo {
    max-height: 76px;
  }

  .m .content,
  .p .content {
    padding: 11px;
  }

  .footer {
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>Western machinery servicing Russia's defense industry</h1>

  <div class="subtitle">
    19 machines serviced by Galika-Service, 2024–2025
  </div>

  <div class="legend">
    <div class="legend-item">
      <strong>Western machinery</strong><br>
      Machines serviced in Russia
    </div>

    <div></div>

    <div class="legend-item">
      <strong>Russian defense producers</strong><br>
      Companies using the machinery
    </div>
  </div>

  <div class="groups" id="groups"></div>

  <div class="footer">
    <div class="source">
      Source: Galika-Service website, company records and public procurement data.
    </div>

    <img src="logo_ki.jpg" alt="The Kyiv Independent">
  </div>

</div>

<script>

const data = [

  /*
    KEEP YOUR EXISTING DATA HERE.

    Example structure:

    {
      machine: {
        name: "Machine name",
        type: "MACHINE TYPE",
        meta: "Additional information",
        image: "IMAGE URL"
      },

      producer: {
        name: "Russian company",
        country: "Russia",
        logo: "LOGO URL"
      }
    }

  */

];


/* RENDER */

const groups = document.getElementById("groups");

data.forEach(item => {

  const group = document.createElement("div");
  group.className = "group";

  group.innerHTML = `

    <div class="m">

      <img
        class="photo"
        src="${item.machine.image}"
        alt=""
      >

      <div class="content">

        <div class="type">
          ${item.machine.type || ""}
        </div>

        <div class="name">
          ${item.machine.name || ""}
        </div>

        <div class="meta">
          ${item.machine.meta || ""}
        </div>

      </div>

    </div>

    <div class="arrow">

      <svg
        viewBox="0 0 40 24"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <line
          x1="2"
          y1="12"
          x2="31"
          y2="12"
          stroke="#111"
          stroke-width="2"
        />

        <polyline
          points="25,6 32,12 25,18"
          fill="none"
          stroke="#111"
          stroke-width="2"
        />
      </svg>

    </div>

    <div class="p">

      <div class="logo-wrap">

        <img
          class="logo"
          src="${item.producer.logo}"
          alt=""
        >

      </div>

      <div class="content">

        <div class="country">
          ${item.producer.country || ""}
        </div>

        <div class="name">
          ${item.producer.name || ""}
        </div>

      </div>

    </div>

  `;

  groups.appendChild(group);

});


/* SEND HEIGHT TO IFRAME */

(function(){

  function sendHeight(){

    const wrap = document.querySelector(".wrap");

    if (!wrap) return;

    const rect = wrap.getBoundingClientRect();

    const height = Math.ceil(rect.bottom + 12);

    window.parent.postMessage(
      {
        galikaHeight: height
      },
      "*"
    );

  }


  function refresh(){

    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        sendHeight();

      });

    });

  }


  window.addEventListener("load", refresh);

  window.addEventListener("resize", refresh);


  if (document.fonts && document.fonts.ready) {

    document.fonts.ready.then(refresh);

  }


  document.querySelectorAll("img").forEach(img => {

    if (img.complete) {

      if (img.decode) {

        img.decode()
          .catch(() => {})
          .then(refresh);

      } else {

        refresh();

      }

    } else {

      img.addEventListener("load", refresh);

    }

  });


  if (window.ResizeObserver) {

    const wrap = document.querySelector(".wrap");

    if (wrap) {

      new ResizeObserver(() => {

        refresh();

      }).observe(wrap);

    }

  }


  setTimeout(refresh, 300);
  setTimeout(refresh, 1000);
  setTimeout(refresh, 2000);

})();

</script>

</body>
</html>
